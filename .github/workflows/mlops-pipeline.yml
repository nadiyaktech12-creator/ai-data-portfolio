name: End-to-End MLOps Pipeline

on:
  push:
    paths:
      - '04-ml-engineering/01-end-to-end-mlops-pipeline/**'
  pull_request:
    paths:
      - '04-ml-engineering/01-end-to-end-mlops-pipeline/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-ml-engineering/01-end-to-end-mlops-pipeline

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train model
        run: python train.py

      - name: Run API tests
        run: pytest test_api.py -v
