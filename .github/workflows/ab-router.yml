name: A/B Model Router API

on:
  push:
    paths:
      - '04-ml-engineering/02-ab-model-router-api/**'
  pull_request:
    paths:
      - '04-ml-engineering/02-ab-model-router-api/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 04-ml-engineering/02-ab-model-router-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Train models
        run: python train_models.py

      - name: Run tests
        run: pytest test_api.py -v
