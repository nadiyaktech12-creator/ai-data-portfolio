name: IoT Sensor Fleet Pipeline

on:
  push:
    paths:
      - '03-data-engineering/03-IoT-sensor-fleet-data-pipeline/**'
  pull_request:
    paths:
      - '03-data-engineering/03-IoT-sensor-fleet-data-pipeline/**'
  workflow_dispatch:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03-data-engineering/03-IoT-sensor-fleet-data-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate sample data
        run: python generate_sensor_data.py

      - name: Load into DuckDB
        run: python load_to_duckdb.py

      - name: Run sample query
        run: python query_example.py
